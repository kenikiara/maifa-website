name: Build & Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Build the React frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm packages
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # 3. Inject real database credentials from GitHub Secrets
      - name: Create db.php from secrets
        run: |
          cat > backend/config/db.php << 'PHPEOF'
          <?php
          define('DB_HOST',    'localhost');
          define('DB_NAME',    '${{ secrets.DB_NAME }}');
          define('DB_USER',    '${{ secrets.DB_USER }}');
          define('DB_PASS',    '${{ secrets.DB_PASS }}');
          define('DB_CHARSET', 'utf8mb4');

          function db(): PDO {
              static $pdo = null;
              if ($pdo !== null) return $pdo;
              $dsn = sprintf('mysql:host=%s;dbname=%s;charset=%s', DB_HOST, DB_NAME, DB_CHARSET);
              $pdo = new PDO($dsn, DB_USER, DB_PASS, [
                  PDO::ATTR_ERRMODE            => PDO::ERRMODE_EXCEPTION,
                  PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                  PDO::ATTR_EMULATE_PREPARES   => false,
              ]);
              return $pdo;
          }
          PHPEOF

      # 4. Update admin password in config.php from secret
      - name: Set admin password in config.php
        run: |
          HASHED=$(php -r "echo password_hash('${{ secrets.ADMIN_PASS }}', PASSWORD_DEFAULT);")
          sed -i "s|password_hash('change_this_password', PASSWORD_DEFAULT)|'$HASHED'|g" backend/config/config.php

      # 5. Copy .htaccess into dist so it deploys with the frontend
      - name: Copy .htaccess into dist
        run: cp .htaccess frontend/dist/.htaccess

      # 6. Install lftp (pre-installed on ubuntu-latest but ensure it's present)
      - name: Install lftp
        run: sudo apt-get install -y lftp

      # 7. Upload React build + .htaccess → maifa.ke/
      - name: Deploy frontend to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
            mirror --reverse --no-perms --parallel=4 \
              --exclude='^\.git' \
              frontend/dist/ /;
            bye
          "

      # 8. Upload PHP backend → maifa.ke/backend/
      - name: Deploy backend to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
            mirror --reverse --no-perms --parallel=4 \
              --exclude='^\.git' \
              backend/ /backend/;
            bye
          "
